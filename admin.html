<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoEarn - Game Admin Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #090d16; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gaming-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="gaming-card w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
        <div class="text-center">
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-purple-500">ADMIN UPLOAD PORTAL</h1>
            <p class="text-xs text-gray-400 mt-1">Manage & Upload Game ROMs / Files</p>
        </div>

        <div class="space-y-3">
            <div>
                <label class="text-xs text-gray-300 font-bold">Select File Type:</label>
                <select id="file-type" class="w-full mt-1 p-2.5 bg-gray-900 border border-gray-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
                    <option value="cue">Game .cue / Rom File</option>
                    <option value="bios">BIOS File (SCPH1001.BIN)</option>
                </select>
            </div>

            <div>
                <label class="text-xs text-gray-300 font-bold">Choose File (.bin, .cue, .zip):</label>
                <input type="file" id="game-file" class="w-full mt-1 p-2 bg-gray-900 border border-gray-700 rounded-xl text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
            </div>

            <button onclick="uploadFile()" class="w-full py-3 bg-gradient-to-r from-red-600 to-purple-600 font-bold rounded-xl text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">
                🚀 Upload to Server
            </button>
        </div>

        <div id="upload-status" class="text-center text-xs text-yellow-400 font-semibold hidden">
            Uploading... Please wait.
        </div>
    </div>

    <script>
        async function uploadFile() {
            let fileInput = document.getElementById('game-file');
            let fileType = document.getElementById('file-type').value;
            let statusDiv = document.getElementById('upload-status');

            if (fileInput.files.length === 0) {
                alert("Please select a file first!");
                return;
            }

            let file = fileInput.files[0];
            let formData = new FormData();
            formData.append("file", file);
            formData.append("type", fileType);

            statusDiv.classList.remove('hidden');
            statusDiv.innerText = "Uploading file, please wait...";

            try {
                // Yahan apna backend upload script ka URL dalna (e.g., upload.php jo aapanel par parhi ho)
                let response = await fetch("https://ludoearn.online/Taken3/upload.php", {
                    method: "POST",
                    body: formData
                });

                let result = await response.json();
                if(result.success) {
                    statusDiv.innerText = "✔ File Uploaded Successfully!";
                    statusDiv.className = "text-center text-xs text-green-400 font-semibold";
                } else {
                    throw new Error(result.message || "Upload failed");
                }
            } catch (err) {
                statusDiv.innerText = "Error: " + err.message + " (Check backend upload.php script)";
                statusDiv.className = "text-center text-xs text-red-400 font-semibold";
            }
        }
    </script>
</body>
</html>
