<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 P2P Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gaming-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header Section -->
    <header class="text-center py-4">
        <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">TEKKEN 3 ARENA</h1>
        <p class="text-xs text-gray-400 mt-1">P2P Battle & Earning Platform</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center space-y-6">
        <!-- User Profile Box -->
        <div id="profile-box" class="gaming-card w-full max-w-sm rounded-2xl p-5 text-center">
            <h2 id="username" class="text-xl font-bold text-yellow-400">Loading User...</h2>
            <p class="text-sm text-gray-300 mt-1">Balance: <span id="balance" class="font-bold text-green-400">0.00</span> TON</p>
        </div>

        <!-- Game Loading & Emulator Screen -->
        <div id="game-container" class="gaming-card w-full max-w-sm rounded-2xl p-4 text-center hidden">
            <h3 class="text-lg font-bold text-pink-400 mb-2">⚔️ Loading Tekken 3 ROM</h3>
            <p id="status-text" class="text-xs text-gray-300 mb-3">Connecting to VPS Game Storage...</p>
            
            <!-- Progress Bar -->
            <div id="progress-area" class="w-full">
                <div class="w-full bg-gray-700 rounded-full h-4 mb-4 overflow-hidden border border-purple-500/40">
                    <div id="progress-bar" class="bg-gradient-to-r from-green-500 to-emerald-400 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="progress-percent" class="text-xs text-yellow-400 font-bold mb-3">0%</p>
            </div>

            <div id="emulator-screen" class="bg-black rounded-xl h-64 hidden flex-col items-center justify-center border border-purple-500/30 p-2 relative overflow-hidden">
                <!-- Actual Game Canvas / Frame Simulation -->
                <div class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950">
                    <div class="w-full h-full flex items-center justify-center border-2 border-red-600/50 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-900 via-black to-black">
                        <div class="text-center p-4">
                            <span class="text-xs uppercase tracking-widest text-red-500 font-extrabold animate-pulse">ROUND 1</span>
                            <h4 class="text-xl font-black text-white mt-1">FIGHT!</h4>
                            <p class="text-[10px] text-gray-400 mt-2">Connected via aapanel VPS Assets</p>
                        </div>
                    </div>
                </div>
            </div>

            <button id="start-fight-btn" onclick="launchActualGame()" class="mt-3 w-full py-3 bg-red-600 hover:bg-red-700 rounded-xl text-xs font-bold hidden shadow-lg uppercase tracking-wider">Start Fight</button>
            <button onclick="closeGame()" class="mt-3 px-4 py-2 bg-gray-700 text-xs rounded-lg font-bold w-full">Exit Game</button>
        </div>

        <!-- Action Buttons -->
        <div id="menu-buttons" class="w-full max-w-sm space-y-3">
            <button onclick="startVPSGameLoad()" class="w-full py-4 bg-gradient-to-r from-red-600 to-purple-600 font-bold rounded-xl shadow-lg transform active:scale-95 transition">
                🎮 Play Tekken 3 (VPS Stream)
            </button>
            <button onclick="openWallet()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-cyan-600 font-bold rounded-xl shadow-lg transform active:scale-95 transition">
                💰 Telegram Wallet / Deposit
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 py-2">
        Powered by Telegram Mini Apps
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `Hello, ${user.first_name || 'Gamer'}!`;
        } else {
            document.getElementById('username').innerText = "Hello, Guest Gamer!";
        }

        function startVPSGameLoad() {
            document.getElementById('menu-buttons').classList.add('hidden');
            document.getElementById('profile-box').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            let progress = 0;
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const statusText = document.getElementById('status-text');

            let downloadInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 12) + 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(downloadInterval);
                    statusText.innerText = "BIOS & Tracks Loaded Successfully!";
                    document.getElementById('progress-area').style.display = "none";
                    document.getElementById('emulator-screen').style.display = "flex";
                    document.getElementById('start-fight-btn').style.display = "block";
                }
                progressBar.style.width = progress + "%";
                progressPercent.innerText = progress + "%";
                
                if(progress < 40) {
                    statusText.innerText = "Fetching BIOS (SCPH1001.BIN)...";
                } else if(progress < 80) {
                    statusText.innerText = "Loading Tracks (.bin / .cue)...";
                } else {
                    statusText.innerText = "Initializing Emulator Engine...";
                }
            }, 150);
        }

        function launchActualGame() {
            alert("Tekken 3 battle session active! Enjoy the game.");
        }

        function closeGame() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('menu-buttons').classList.remove('hidden');
            document.getElementById('profile-box').classList.remove('hidden');
            document.getElementById('emulator-screen').style.display = "none";
            document.getElementById('progress-area').style.display = "block";
            document.getElementById('start-fight-btn').style.display = "none";
            document.getElementById('progress-bar').style.width = "0%";
            document.getElementById('progress-percent').innerText = "0%";
        }

        function openWallet() {
            window.open('https://t.me/wallet', '_blank');
        }
    </script>
</body>
</html>
