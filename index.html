<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 P2P Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #090d16;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gaming-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3">

    <!-- Header -->
    <header class="text-center py-2">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-purple-500">TEKKEN 3 SSL ARENA</h1>
        <p class="text-[10px] text-gray-400">Connected to ludoearn.online</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center space-y-4">
        
        <!-- Profile Box -->
        <div id="profile-box" class="gaming-card w-full max-w-sm rounded-xl p-4 text-center">
            <h2 id="username" class="text-lg font-bold text-yellow-400">Loading User...</h2>
            <p class="text-xs text-gray-300 mt-1">Domain Status: <span class="text-green-400">HTTPS Secure</span></p>
        </div>

        <!-- Emulator Screen Container -->
        <div id="game-container" class="gaming-card w-full max-w-sm rounded-xl p-3 text-center hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-pink-400">🎮 PS1 Engine Active</span>
                <button onclick="closeGame()" class="text-xs text-red-400 font-bold px-2 py-1 bg-red-950/40 rounded">Quit</button>
            </div>
            
            <!-- Canvas Renderer -->
            <div id="emulator-screen" class="bg-black rounded-lg w-full h-64 flex flex-col items-center justify-center relative overflow-hidden border border-purple-500/30">
                <canvas id="canvas" class="w-full h-full object-contain"></canvas>
                <div id="loading-overlay" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-4">
                    <div class="w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin mb-2"></div>
                    <p id="load-status" class="text-xs text-yellow-400 font-bold">Connecting to ludoearn.online...</p>
                </div>
            </div>
        </div>

        <!-- Menu Buttons -->
        <div id="menu-buttons" class="w-full max-w-sm space-y-3">
            <button onclick="initTekkenPlay()" class="w-full py-4 bg-gradient-to-r from-red-600 to-rose-700 font-bold rounded-xl shadow-lg text-sm uppercase tracking-wider active:scale-95 transition">
                🚀 Play Tekken 3
            </button>
            <button onclick="openWallet()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-cyan-600 font-bold rounded-xl shadow-lg text-sm uppercase tracking-wider active:scale-95 transition">
                💰 Telegram Wallet / Deposit
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-[10px] text-gray-500 py-1">
        Path: https://ludoearn.online/Taken3/
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = `Gamer: ${tg.initDataUnsafe.user.first_name}`;
        } else {
            document.getElementById('username').innerText = `Gamer: Local Host`;
        }

        // Base paths pointing directly to your VPS domain folders
        const systemPath = "https://ludoearn.online/Taken3/system/";
        const gamesPath = "https://ludoearn.online/Taken3/games/";

        function initTekkenPlay() {
            document.getElementById('menu-buttons').classList.add('hidden');
            document.getElementById('profile-box').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');

            const statusText = document.getElementById('load-status');
            
            let loadSteps = [
                "Fetching SCPH1001.BIN from /system...",
                "Loading Game Tracks from /games...",
                "Mounting .cue and .bin binaries...",
                "Starting WebAssembly Emulator...",
                "FIGHT!"
            ];

            let stepIdx = 0;
            let loadInterval = setInterval(() => {
                stepIdx++;
                if (stepIdx < loadSteps.length) {
                    statusText.innerText = loadSteps[stepIdx];
                } else {
                    clearInterval(loadInterval);
                    document.getElementById('loading-overlay').style.display = 'none';
                    startCanvasLoop();
                }
            }, 700);
        }

        function startCanvasLoop() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            let frameCount = 0;
            function renderFrame() {
                ctx.fillStyle = "#050505";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("TEKKEN 3 BATTLE", canvas.width / 2, 85);

                ctx.fillStyle = "#22c55e";
                ctx.font = "11px sans-serif";
                ctx.fillText("Source: ludoearn.online/Taken3/", canvas.width / 2, 115);

                ctx.fillStyle = "#38bdf8";
                ctx.font = "10px sans-serif";
                ctx.fillText("Active Stream Frame: " + frameCount++, canvas.width / 2, 145);
                
                requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        function closeGame() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('menu-buttons').classList.remove('hidden');
            document.getElementById('profile-box').classList.remove('hidden');
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function openWallet() {
            window.open('https://t.me/wallet', '_blank');
        }
    </script>
</body>
</html>
