<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 P2P Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gaming-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header Section -->
    <header class="text-center py-4">
        <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-400">TEKKEN 3 ARENA</h1>
        <p class="text-xs text-gray-400 mt-1">P2P Battle & Earning Platform</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center space-y-6">
        <!-- User Profile Box -->
        <div class="gaming-card w-full max-w-sm rounded-2xl p-5 text-center">
            <h2 id="username" class="text-xl font-bold text-yellow-400">Loading User...</h2>
            <p class="text-sm text-gray-300 mt-1">Balance: <span id="balance" class="font-bold text-green-400">0.00</span> TON</p>
        </div>

        <!-- Real Game Loading & Match Area -->
        <div id="game-container" class="gaming-card w-full max-w-sm rounded-2xl p-4 text-center hidden">
            <h3 class="text-lg font-bold text-pink-400 mb-2">⚔️ Downloading Game Files</h3>
            <p id="status-text" class="text-xs text-gray-300 mb-3">Connecting to VPS Game Server...</p>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-700 rounded-full h-4 mb-4 overflow-hidden border border-purple-500/40">
                <div id="progress-bar" class="bg-gradient-to-r from-green-500 to-emerald-400 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progress-percent" class="text-xs text-yellow-400 font-bold mb-3">0%</p>

            <div id="emulator-screen" class="bg-black rounded-xl h-36 hidden items-center justify-center border border-purple-500/30">
                <p class="text-xs text-green-400 font-bold">Game Assets Loaded Successfully!</p>
            </div>

            <button onclick="closeGame()" class="mt-3 px-4 py-2 bg-gray-700 text-xs rounded-lg font-bold">Cancel / Exit</button>
        </div>

        <!-- Action Buttons -->
        <div id="menu-buttons" class="w-full max-w-sm space-y-3">
            <button onclick="startRealDownload()" class="w-full py-4 bg-gradient-to-r from-red-600 to-purple-600 font-bold rounded-xl shadow-lg transform active:scale-95 transition">
                🎮 Start Game & Download ROM
            </button>
            <button onclick="openWallet()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-cyan-600 font-bold rounded-xl shadow-lg transform active:scale-95 transition">
                💰 Telegram Wallet / Deposit
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 py-2">
        Powered by Telegram Mini Apps
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `Hello, ${user.first_name || 'Gamer'}!`;
        } else {
            document.getElementById('username').innerText = "Hello, Guest Gamer!";
        }

        // Yahan apni VPS ka direct link dalna hai jahan game file (zip/rom) padi hai
        const vpsGameFileUrl = "http://231.111.212:18874/tekken3.zip"; // Isay apne aapanel link se match kar lena

        function startRealDownload() {
            document.getElementById('menu-buttons').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            let progress = 0;
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            const statusText = document.getElementById('status-text');

            // Simulate real file downloading chunks from VPS
            let downloadInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 3; // Random chunk progress
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(downloadInterval);
                    statusText.innerText = "Download Complete! Starting Emulator...";
                    setTimeout(() => {
                        document.getElementById('emulator-screen').style.display = "flex";
                    }, 1000);
                }
                progressBar.style.width = progress + "%";
                progressPercent.innerText = progress + "%";
                if(progress < 50) {
                    statusText.innerText = "Fetching files from aapanel VPS...";
                } else if(progress < 90) {
                    statusText.innerText = "Extracting game rom assets...";
                }
            }, 200);
        }

        function closeGame() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('menu-buttons').classList.remove('hidden');
            document.getElementById('emulator-screen').style.display = "none";
            document.getElementById('progress-bar').style.width = "0%";
            document.getElementById('progress-percent').innerText = "0%";
        }

        function openWallet() {
            window.open('https://t.me/wallet', '_blank');
        }
    </script>
</body>
</html>
